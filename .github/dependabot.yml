# Weekly dependency updates, opened against develop. Minor and patch
# updates are grouped into one pull request per ecosystem.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/planche"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/planche/src-tauri"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
