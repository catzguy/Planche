# Builds the Android packages of Planche: a universal APK (direct install)
# and an AAB (Google Play), signed with the upload key from the repository
# secrets (docs/ANDROID.md). Without those secrets the release build is
# unsigned: it compiles but cannot be installed. release.yml calls it.
name: Android

on:
  # Pull requests that touch the Android build (it takes ~20 minutes).
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/android.yml"
      - "planche/src-tauri/gen/android/**"
      - "planche/src-tauri/plugins/**"
      - "planche/src-tauri/vendor/**"
      - "planche/src-tauri/src/storage.rs"
      - "planche/src-tauri/Cargo.*"
      - "planche/src-tauri/tauri.conf.json"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planche
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planche/package-lock.json

      # Actions are pinned to a commit: this job holds the signing key, and a
      # moved tag must not be able to run new code next to it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: planche/src-tauri

      - run: npm ci

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No Android signing key in the secrets: the release build is unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "password=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > src-tauri/gen/android/keystore.properties

      - run: npm run tauri android build -- --apk --aab

      # The key and its password do not stay on the runner for the later steps
      # (artifact upload, cache post-step).
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" src-tauri/gen/android/keystore.properties

      - name: Name packages
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          out=src-tauri/gen/android/app/build/outputs
          mkdir -p ../android-packages
          cp "$(find $out/apk -name '*universal*release*.apk' | head -1)" "../android-packages/Planche_${version}_android.apk"
          cp "$(find $out/bundle -name '*universal*release*.aab' | head -1)" "../android-packages/Planche_${version}_android.aab"
          ls -lh ../android-packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planche-android
          path: android-packages/*
