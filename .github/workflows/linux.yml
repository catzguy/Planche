# Builds the Linux packages (.deb, .rpm, .AppImage) of Planche.
# Ubuntu 22.04 keeps the glibc requirement low so the packages run on
# Debian 12+, Ubuntu 22.04+, Fedora 36+ and their derivatives.
# release.yml calls it to publish versions.
name: Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: planche
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planche/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: planche/src-tauri

      - run: npm ci
      - run: node scripts/i18n-keys.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planche-linux
          path: |
            planche/src-tauri/target/release/bundle/deb/*.deb
            planche/src-tauri/target/release/bundle/rpm/*.rpm
            planche/src-tauri/target/release/bundle/appimage/*.AppImage
