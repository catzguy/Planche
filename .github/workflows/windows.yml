# Builds the Windows installers (NSIS .exe and .msi) of Planche.
# Tauri downloads NSIS and WiX itself; the runner provides MSVC and WebView2.
# Runs on pull requests; release.yml calls it to publish versions.
name: Windows

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: planche
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planche/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: planche/src-tauri

      - run: npm ci
      - run: node scripts/i18n-keys.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build

      # Unsigned MSIX for the Microsoft Store (the Store signs it). Identity
      # from the repository variables, test values when they are not set.
      - name: MSIX package
        shell: pwsh
        run: ./scripts/build-msix.ps1
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planche-windows
          path: |
            planche/src-tauri/target/release/bundle/nsis/*.exe
            planche/src-tauri/target/release/bundle/msi/*.msi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planche-msix
          path: planche/src-tauri/target/release/bundle/msix/*.msix
