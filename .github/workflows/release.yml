# Publishes Planche's installers to GitHub Releases.
# - Tag v1.2.3: builds Windows and Linux, then creates the "Planche 1.2.3"
#   release (notes generated from the merged pull requests) with all packages.
#   The tag must match the version in planche/src-tauri/tauri.conf.json.
# - Push to develop: replaces the "develop-latest" pre-release with packages
#   of the latest develop commit, for testing.
# - Tag v1.2.3, when the Store is configured: also submits the MSIX to the
#   Microsoft Store.
# - Android: the signed APK goes to the GitHub release; on a tag, the AAB goes
#   to Google Play when GOOGLE_PLAY_TRACK is set (docs/ANDROID.md).
name: Release

on:
  push:
    tags: ["v*"]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  # A called workflow cannot ask for more than its caller grants.
  windows:
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read

  linux:
    uses: ./.github/workflows/linux.yml
    permissions:
      contents: read

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The unsigned MSIX (planche-msix) goes to the Store only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planche-windows
          path: packages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planche-linux
          path: packages

      # The APK installs directly; the AAB only serves Google Play.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planche-android
          path: android

      - name: Android APK
        run: cp android/*.apk packages/

      - name: List packages
        run: find packages -type f -exec ls -lh {} \;

      - name: Version release
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version planche/src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Planche $version" --generate-notes
          fi
          find packages -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber

      - name: Development pre-release
        if: github.ref_type == 'branch'
        run: |
          tag=develop-latest
          gh release delete "$tag" --yes --cleanup-tag || true
          find packages -type f -print0 | xargs -0 gh release create "$tag" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Planche develop (${GITHUB_SHA::7})" \
            --notes "Version de test compilée automatiquement depuis la branche develop (commit $GITHUB_SHA). Elle est remplacée à chaque fusion dans develop ; pour un usage normal, préférer la dernière version stable."

  # Submits the MSIX of a version to the Microsoft Store, once the GitHub
  # release is published. Needs the MSSTORE_PRODUCT_ID variable and the Partner
  # Center secrets (docs/MICROSOFT_STORE.md); skipped otherwise.
  store:
    needs: [windows, publish]
    if: github.ref_type == 'tag' && vars.MSSTORE_PRODUCT_ID != ''
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planche-msix
          path: msix

      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      # Secrets reach the command through the environment, not through the
      # script text (where they would also sit in the process command line).
      - name: Partner Center credentials
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        shell: pwsh
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: Submit to the Microsoft Store
        env:
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        shell: pwsh
        run: |
          $package = Get-ChildItem msix\*.msix | Select-Object -First 1
          msstore publish $package.FullName --appId $env:PRODUCT_ID

  # Uploads the AAB of a version to Google Play, on the GOOGLE_PLAY_TRACK track
  # (internal, alpha, beta or production), with the service account secret of
  # the google-play environment (docs/ANDROID.md); skipped when the variable is unset.
  play:
    needs: [android, publish]
    if: github.ref_type == 'tag' && vars.GOOGLE_PLAY_TRACK != ''
    runs-on: ubuntu-latest
    environment: google-play
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planche-android
          path: android

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.planche.reader
          releaseFiles: android/*.aab
          track: ${{ vars.GOOGLE_PLAY_TRACK }}
          status: ${{ vars.GOOGLE_PLAY_STATUS || 'completed' }}
