[package]
name = "planche"
version = "0.1.0"
description = "Lecteur de bandes dessinées, mangas, PDF et EPUB"
authors = ["catzguy"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "planche_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.0", features = ["backup", "bundled", "serialize"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
unrar = "0.5.8"
sevenz-rust2 = "0.24.1"
tar = "0.4.46"
natord = "1.0.9"
regex = "1.13.1"
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
futures-util = "0.3.34"
percent-encoding = "2.3.2"
url = "2.5.8"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
chacha20poly1305 = "0.11.0"
tauri-plugin-planche-storage = { path = "plugins/planche-storage" }

# TLS from the system on the desktop; on Android, rustls with Mozilla's roots
# (no OpenSSL to link against there).
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "http2"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-root-certs = "1"
jni = "0.21"
ndk-context = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

# unrar_sys with its build script fixed for cross-compilation (vendor/unrar_sys/build.rs).
[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }
